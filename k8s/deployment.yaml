apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-taxi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-taxi
  template:
    metadata:
      labels:
        app: mlops-taxi
    spec:
      serviceAccountName: mlops-taxi-sa
      containers:
        - name: mlops-taxi
          image: 665012226357.dkr.ecr.us-east-1.amazonaws.com/mlops-taxi:latest
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "mlops-taxi-redis.ima0as.0001.use1.cache.amazonaws.com"
