apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-taxi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-taxi
  template:
    metadata:
      labels:
        app: mlops-taxi
    spec:
      containers:
        - name: mlops-taxi
          image: mlops-taxi:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
